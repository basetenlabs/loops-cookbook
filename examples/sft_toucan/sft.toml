# SFT on real tool-agent trajectories from Agent-Ark/Toucan-1.5M. make_data.py writes
# the data. `loops check` on this file renders it and reports what trains.

recipe = "sft"

[model]
base_model = "Qwen/Qwen3.6-35B-A3B"
lora_rank = 32
max_seq_len = 4096
# Toucan has no reasoning. "Choosing settings" in docs/reference/sft.md explains what
# that means for these settings.
renderer_chat_template_kwargs = { enable_thinking = false }

[data]
train = "data/train.jsonl"
validation = "data/validation.jsonl"

[training]
max_steps = 0
learning_rate = 2e-4
lr_schedule = "cosine"
warmup_steps = 10
batch_size = 16
epochs = 1

[eval]
every_steps = 10

[compute]
scope = "serverless"

[output]
run_name = "sft-toucan"
trainer_checkpoint_every = 25
sampler_checkpoint_every = 0
checkpoint_ttl_seconds = 0
