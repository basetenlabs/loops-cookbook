# The custom in-process direct pattern with no environment, scheduled asynchronously:
# rollouts for the next step are sampled while the current one trains, up to two steps
# off-policy. A smoke that checkpoints every step.
# uv run loops check examples/async_scheduling/train.toml

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.episodes:create_runtime"

[rollout_runtime.config]
episode = "answer_episode:AnswerEpisode"
agent_timeout_seconds = 90   # cut before the reply: unversioned; after it: graded, 0 if no answer was kept

[rollout_runtime.files]
tasks = "../../tasks/hidden_answer_35b.jsonl"   # one hidden answer to learn (tasks/README)

[model]
base_model = "Qwen/Qwen3.6-35B-A3B"
lora_rank = 8
max_seq_len = 1024
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
max_generation_tokens = 16

[training]
mode = "async"
group_size = 16
max_group_losses = 0
groups_per_step = 1
max_steps = 5
max_consecutive_unusable_groups = 20   # stop if every group scores alike
learning_rate = 0.00002
max_steps_off_policy = 2
max_policy_delta_in_trajectory = 2
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 16
max_concurrent_verifiers = 16
setup_timeout_seconds = 60

[rollout.grading]
timeout_seconds = 10

[compute]
scope = "serverless"

[output]
run_name = "async-none"
output_dir = "runs/async-none"
trainer_checkpoint_every = 1
sampler_checkpoint_every = 1
checkpoint_ttl_seconds = 0
