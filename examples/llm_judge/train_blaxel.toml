# An Episode, in-process, direct, on Blaxel sandboxes, whose groups an LLM judge ranks.
# judge_episode.py answers with llm() and writes the answer into a sandbox the run
# provisions. grade() reads the answer back from that sandbox. grade_group() asks a
# judge model, through its own OpenAI-compatible client, to rank each group's answers.
# uv sync --extra blaxel
# uv run loops check examples/llm_judge/train_blaxel.toml

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.episodes:create_runtime"

[rollout_runtime.config]
episode = "judge_episode:SandboxedRankedEpisode"
agent_timeout_seconds = 60

# One Blaxel sandbox per episode, provisioned before setup() and released by the run.
[rollout_runtime.config.sandbox]
provider = "blaxel"
image = "blaxel/base-image:latest"
memory_mb = 2048
# Required. The sandbox must outlast one episode.
ttl = "1h"

# The episode's own settings, which check validates as its JudgeOptions. They configure
# the judge, never the policy. No secret goes here, because the key stays in the
# environment.
[rollout_runtime.config.options]
# Any OpenAI-compatible endpoint works.
judge_base_url = "https://inference.baseten.co/v1"
judge_model = "openai/gpt-oss-120b"
# The environment variable that holds the judge's key.
judge_api_key_env = "BASETEN_API_KEY"
# The judge's ranking makes up this share of the reward, and grade()'s length
# reward makes up the rest.
rank_weight = 0.8
max_words = 60

[rollout_runtime.files]
tasks = "tasks.jsonl"

[providers.blaxel]
# Credentials stay in .env as BL_WORKSPACE and BL_API_KEY.
region = "us-was-1"

[model]
base_model = "Qwen/Qwen3.5-4B"
lora_rank = 8
max_seq_len = 1024
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
max_generation_tokens = 128

[training]
mode = "sync"
group_size = 16
max_group_losses = 0
groups_per_step = 1
max_steps = 5
# Stop after this many groups in a row that can't train, such as groups in which
# every rollout scores alike.
max_consecutive_unusable_groups = 20
learning_rate = 0.0001
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 8
# One judge call holds a verifier slot for its whole group.
max_concurrent_verifiers = 4
# A rollout whose sandbox fails is retried up to this many times.
max_rollout_retries = 2
# The deadline for setup(), which attaches to the sandbox.
setup_timeout_seconds = 90
# A judge that keeps failing stops the run.
max_consecutive_rollout_failures = 8

[rollout.grading]
# The deadline for each grade() try and each judge call.
timeout_seconds = 120

[compute]
scope = "dedicated"

[output]
run_name = "custom-llm-judge-blaxel"
output_dir = "runs/custom-llm-judge-blaxel"
trainer_checkpoint_every = 0
sampler_checkpoint_every = 0
checkpoint_ttl_seconds = 0
