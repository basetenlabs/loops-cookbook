# An agent built on LiteLLM that streams its replies. It uses a custom rollout runtime,
# in-process, with openai_http model access and no environment. litellm_episode.py asks
# the model and scores each answer itself.
# LiteLLM is not a cookbook dependency, so run the example with
# --with 'litellm!=1.107.0', as in this command.
# uv run --with 'litellm!=1.107.0' loops check examples/litellm_streaming/train.toml

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.episodes:create_runtime"

[rollout_runtime.config]
episode = "litellm_episode:AnswerEpisode"
# The agent's deadline. A rollout cut off before the model replies is discarded.
# One cut off after the reply is graded, and scores 0 if it kept no answer.
agent_timeout_seconds = 90

[rollout_runtime.files]
# Each task hides one answer for the model to learn. tasks/README.md describes the file.
tasks = "../../tasks/hidden_answer_35b.jsonl"

[model]
base_model = "Qwen/Qwen3.6-35B-A3B"
lora_rank = 8
max_seq_len = 1024
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
max_generation_tokens = 16

[training]
mode = "sync"
group_size = 16
max_group_losses = 0
groups_per_step = 1
max_steps = 5
# Stop after this many groups in a row that can't train, such as groups in which
# every rollout scores alike.
max_consecutive_unusable_groups = 20
learning_rate = 0.00002
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 16
max_concurrent_verifiers = 16
setup_timeout_seconds = 60

[rollout.grading]
timeout_seconds = 10

[compute]
scope = "serverless"

[output]
run_name = "litellm-streaming-none"
output_dir = "runs/litellm-streaming-none"
trainer_checkpoint_every = 0
sampler_checkpoint_every = 0
checkpoint_ttl_seconds = 0
