# An agent built on LiteLLM, streaming: a custom runtime, in-process, openai_http, with
# no environment: litellm_episode.py asks the model and scores each answer itself.
# LiteLLM is not a cookbook dependency; run it with --with 'litellm!=1.107.0':
# uv run --with 'litellm!=1.107.0' loops check examples/litellm_streaming/train.toml

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.episodes:create_runtime"

[rollout_runtime.config]
episode = "litellm_episode:AnswerEpisode"
agent_timeout_seconds = 90   # cut before the reply: unversioned; after it: graded, 0 if no answer was kept

[rollout_runtime.files]
tasks = "../../tasks/hidden_answer_35b.jsonl"   # one hidden answer to learn (tasks/README)

[model]
base_model = "Qwen/Qwen3.6-35B-A3B"
lora_rank = 8
max_seq_len = 1024
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
max_generation_tokens = 16

[training]
mode = "sync"
group_size = 16
max_group_losses = 0
groups_per_step = 1
max_steps = 5
max_consecutive_unusable_groups = 20   # stop if every group scores alike
learning_rate = 0.00002
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 16
max_concurrent_verifiers = 16
setup_timeout_seconds = 60

[rollout.grading]
timeout_seconds = 10

[compute]
scope = "serverless"

[output]
run_name = "litellm-streaming-none"
output_dir = "runs/litellm-streaming-none"
trainer_checkpoint_every = 0
sampler_checkpoint_every = 0
checkpoint_ttl_seconds = 0
