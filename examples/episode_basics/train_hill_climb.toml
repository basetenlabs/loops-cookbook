# A host-only hill climb. The model guesses a letter from A to D, and the host scores
# the guess against the hidden target.
# uv run loops run examples/episode_basics/train_hill_climb.toml

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.episodes:create_runtime"

[rollout_runtime.config]
episode = "hill_climb_episode:HillClimbEpisode"
# The agent's deadline. A rollout cut off before the model replies is discarded.
# One cut off after the reply is graded, and scores 0 if it kept no answer.
agent_timeout_seconds = 90

[rollout_runtime.files]
tasks = "hill_climb_tasks.jsonl"

[model]
base_model = "Qwen/Qwen3.5-4B"
lora_rank = 8
max_seq_len = 1024
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
max_generation_tokens = 16

[training]
mode = "sync"
group_size = 16
max_group_losses = 0
groups_per_step = 1
max_steps = 5
# Stop after this many groups in a row that can't train, such as groups in which
# every rollout scores alike.
max_consecutive_unusable_groups = 20
learning_rate = 0.0001
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 16
max_concurrent_verifiers = 16
setup_timeout_seconds = 60

[rollout.grading]
timeout_seconds = 10

[compute]
scope = "dedicated"

[output]
run_name = "episode-hill-climb"
output_dir = "runs/episode-hill-climb"
trainer_checkpoint_every = 0
sampler_checkpoint_every = 0
checkpoint_ttl_seconds = 0
