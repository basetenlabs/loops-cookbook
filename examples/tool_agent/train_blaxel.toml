# A multi-turn agent with tools, in a Blaxel sandbox. tool_episode.py writes each task's
# files into a sandbox the run provisions. The model changes those files with a shell
# and a file writer. The episode then grades what the sandbox holds with the task's
# check.
# uv sync --extra blaxel
# uv run loops check examples/tool_agent/train_blaxel.toml

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.episodes:create_runtime"

[rollout_runtime.config]
episode = "tool_episode:ToolEpisode"
# The agent's deadline. A rollout cut off before the model replies is discarded.
# One cut off after the reply is graded on what the agent left in the sandbox.
agent_timeout_seconds = 180

# The agent's own limits, validated at check as its ToolOptions.
[rollout_runtime.config.options]
max_turns = 12
command_timeout_seconds = 20
max_output_chars = 2000

# One Blaxel sandbox per episode, provisioned before setup() and released by the run.
[rollout_runtime.config.sandbox]
provider = "blaxel"
image = "blaxel/base-image:latest"
memory_mb = 2048
# Required. The sandbox must outlast one episode.
ttl = "1h"

[rollout_runtime.files]
tasks = "tasks.jsonl"

[providers.blaxel]
# Credentials stay in .env as BL_WORKSPACE and BL_API_KEY.
region = "us-was-1"

[model]
base_model = "Qwen/Qwen3.5-4B"
lora_rank = 8
# The limit covers the whole conversation, including tool results.
max_seq_len = 8192
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
max_generation_tokens = 512

[training]
mode = "sync"
group_size = 16
# A cloud sandbox can fail, so a group that loses one rollout still trains.
max_group_losses = 1
groups_per_step = 1
max_steps = 5
# Stop after this many groups in a row that can't train, such as groups in which
# every rollout scores alike.
max_consecutive_unusable_groups = 20
learning_rate = 0.0001
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 16
max_concurrent_verifiers = 16
# A rollout whose sandbox fails is retried up to this many times.
max_rollout_retries = 2
# The deadline for setup(), which attaches to the sandbox and writes the task's
# files.
setup_timeout_seconds = 90

[rollout.grading]
timeout_seconds = 60

[compute]
scope = "dedicated"

[output]
run_name = "tool-agent-blaxel"
output_dir = "runs/tool-agent-blaxel"
trainer_checkpoint_every = 0
sampler_checkpoint_every = 0
checkpoint_ttl_seconds = 0
