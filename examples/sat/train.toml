# 3-SAT, one model call per problem, with held-out problems evaluated as it trains.
# uv run loops run examples/sat/train.toml

recipe = "rl"

[runtime]
factory = "loops_cookbook.episodes:create_runtime"

[runtime.config]
episode = "sat_episode:SatEpisode"
agent_timeout_seconds = 3600

[runtime.config.options]
# Qwen3.6-35B-A3B before training: pass@1 11%, pass@8 67% at 21 variables (36% and
# 92% at 15, 3% and 17% at 25).
variables = 21
clause_ratio = 4.26

[runtime.files]
tasks = "problems.jsonl"

[model]
base_model = "Qwen/Qwen3.6-35B-A3B"
lora_rank = 64
max_seq_len = 32768
# Thinking off: it works the problem in its reply, about 12k tokens, and ends on its own.
# Thinking on runs past 32k, or ends mid-thought, on half its replies.
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
max_generation_tokens = 24576

[training]
# Async: replies vary in length, so no update waits for the slowest.
mode = "async"
group_size = 8
groups_per_step = 8
max_group_losses = 2
max_steps = 50
learning_rate = 0.00002
loss_fn = "cispo"
max_steps_off_policy = 4
max_policy_delta_in_trajectory = 1
admission_steps_ahead = 2

[rollout]
max_concurrent_rollouts = 256   # three batches in flight, and room for replacements
max_concurrent_verifiers = 64
setup_timeout_seconds = 60

[rollout.grading]
timeout_seconds = 10

[eval]
every_steps = 5   # and before the first update and after the last

[eval.sets.val]
samples_per_task = 2
max_concurrent_rollouts = 128

[eval.sets.val.runtime.files]
tasks = "problems_val.jsonl"   # seeds training never draws

[compute]
scope = "serverless"

[output]
run_name = "sat"
output_dir = "runs/sat"
trainer_checkpoint_every = 10
sampler_checkpoint_every = 0
checkpoint_ttl_seconds = 0
