# 3-SAT, one model call per problem, with held-out problems evaluated as it trains.
# uv run loops run examples/sat/train.toml

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.episodes:create_runtime"

[rollout_runtime.config]
episode = "sat_episode:SatEpisode"
agent_timeout_seconds = 3600

[rollout_runtime.config.options]
# Before training, Qwen3.6-35B-A3B scores pass@1 11% and pass@8 67% at 21 variables.
# It scores 36% and 92% at 15 variables, and 3% and 17% at 25.
variables = 21
clause_ratio = 4.26

[rollout_runtime.files]
tasks = "problems.jsonl"

[model]
base_model = "Qwen/Qwen3.6-35B-A3B"
lora_rank = 64
max_seq_len = 32768
# With thinking off, the model works the problem in its reply, in about 12k tokens,
# and ends on its own.
# Thinking on runs past 32k, or ends mid-thought, on half its replies.
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
max_generation_tokens = 24576

[training]
# Replies vary in length, so async mode keeps each update from waiting for the slowest.
mode = "async"
group_size = 8
groups_per_step = 8
max_group_losses = 2
max_steps = 50
learning_rate = 0.00002
loss_fn = "cispo"
max_steps_off_policy = 4
max_policy_delta_in_trajectory = 1
admission_steps_ahead = 2

[rollout]
# This allows three batches in flight, with room for replacements.
max_concurrent_rollouts = 256
max_concurrent_verifiers = 64
setup_timeout_seconds = 60

[rollout.grading]
timeout_seconds = 10

[eval]
# The eval also runs before the first update and after the last.
every_steps = 5

[eval.sets.val]
samples_per_task = 2
max_concurrent_rollouts = 128

[eval.sets.val.rollout_runtime.files]
# These problems come from seeds that training never draws.
tasks = "problems_val.jsonl"

[compute]
scope = "serverless"

[output]
run_name = "sat"
output_dir = "runs/sat"
trainer_checkpoint_every = 10
sampler_checkpoint_every = 0
checkpoint_ttl_seconds = 0
