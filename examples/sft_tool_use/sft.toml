# SFT on a unit-conversion assistant that calls a tool. `loops check` on this
# file renders every conversation and reports what trains; `loops run` trains.
recipe = "sft"

[model]
base_model = "Qwen/Qwen3.6-35B-A3B"
lora_rank = 32
# Required for SFT: a conversation longer than this is refused before training.
max_seq_len = 4096

[data]
# Written by make_data.py beside this file; paths are relative to this file.
train = "train.jsonl"
validation = "validation.jsonl"

[training]
max_steps = 0
learning_rate = 2e-4
lr_schedule = "cosine"
warmup_steps = 2
batch_size = 8
epochs = 3

[eval]
every_steps = 4

[compute]
scope = "serverless"

[output]
run_name = "sft-tool-use"
trainer_checkpoint_every = 0
sampler_checkpoint_every = 0
checkpoint_ttl_seconds = 0
