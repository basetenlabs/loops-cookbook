name: prepare-release
# Opens the release PR from develop into main. Merging it publishes the release
# (release.yml). CI on a PR opened by the workflow token waits for a maintainer's
# "Approve and run".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, X.Y.Z"
        required: true

permissions:
  contents: write  # the release-notes preview (generate-notes) needs write
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: echo "version=$(python3 scripts/release_version.py version "$VERSION")" >> "$GITHUB_OUTPUT"
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$(git rev-list origin/main..origin/develop)" ]]; then
            echo "::error::develop has nothing main doesn't; there is nothing to release"
            exit 1
          fi
          ARGS=(-f "tag_name=v$VERSION" -f "target_commitish=develop")
          PREVIOUS=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [[ -n "$PREVIOUS" ]]; then ARGS+=(-f "previous_tag_name=$PREVIOUS"); fi
          NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq .body)
          BODY=$(printf 'Merging this tags its merge commit v%s and publishes the release. Merge with **Create a merge commit**.\n\nCI on this PR waits for a maintainer: **Approve and run** it.\n\n## Release notes preview\n\n%s\n' "$VERSION" "$NOTES")
          gh pr create --base main --head develop --title "Release v$VERSION" --body "$BODY"
