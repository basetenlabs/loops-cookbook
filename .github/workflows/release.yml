name: release
# Two ways in:
# - a maintainer runs this workflow on main with a version X.Y.Z: it tags the head of
#   main and publishes it;
# - a vX.Y.Z-alpha.N tag on a commit on main: publish a pre-release.
# A tag pushed with the workflow token starts no other workflow, so tagging and
# publishing happen in this one workflow. The build job builds, pypi uploads through
# trusted publishing, and github-release pushes the tag and attaches the build. Only
# pypi can get a PyPI token, and it runs no project code.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, X.Y.Z"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs beside build. pypi waits for both, so a failure on either end of the ranges
  # still stops the upload.
  dependency-ranges:
    uses: ./.github/workflows/dependency-ranges.yml
    with:
      ref: ${{ github.sha }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      previous: ${{ steps.tag.outputs.previous }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          fetch-depth: 0

      - name: Name the release
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Only reviewed code is released. Every commit on main came through a PR
            # with the required checks.
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::run the release on main, not on $GITHUB_REF_NAME"
              exit 1
            fi
            VERSION=$(python3 scripts/release_version.py "$VERSION")
            TAG="v$VERSION"
            # Tagged here so the build reads its version from it; github-release pushes it.
            git tag "$TAG"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            TAG="$GITHUB_REF_NAME"
            # A tag can name any commit, and a PyPI upload is permanent: publish only
            # reviewed code, that is, a commit on main.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$TAG names $GITHUB_SHA, which is not on main; tag a commit on main"
              exit 1
            fi
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$GITHUB_REF_NAME: a release vX.Y.Z is made by running this workflow, not by pushing its tag; pushed tags are vX.Y.Z-alpha.N"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The notes cover every change since the last release, not the last pre-release.
          PREVIOUS=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | sort -V | tail -1 || true)
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - uses: chainguard-actions/astral-sh-setup-uv@ea3c922ff6ab7051ba1a202db24215b7536b429e # v7.6.0
        with:
          enable-cache: true

      - run: uv sync --locked --extra harbor-blaxel --extra harbor-daytona --extra wandb
      - run: uv run --locked ruff check src tests patterns examples tasks scripts
      - run: uv run --locked pyright
      - run: uv run --locked pytest -q

      # PyPI shows the README without the repository around it, so pyproject.toml turns
      # its relative links into links to main. Point them at the tag instead, so they
      # show the released files. The edit leaves the checkout dirty, and hatch-vcs would
      # then build a .dev version, so the build takes the version from the tag.
      - name: Point the PyPI README's links at the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sed -i -e "s#/loops-cookbook/main/#/loops-cookbook/$TAG/#g" \
                 -e "s#/loops-cookbook/blob/main/#/loops-cookbook/blob/$TAG/#g" pyproject.toml
          if grep -q "loops-cookbook/\(blob/\)\?main/" pyproject.toml; then
            echo "::error::pyproject.toml still links the PyPI README to main"
            exit 1
          fi
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - run: uv build

      # The release states the versions it was tested with. This is the lock; the two
      # ends of the ranges come from dependency-ranges.
      - run: >-
          uv export --locked --no-hashes --no-emit-project
          --extra harbor-blaxel --extra harbor-daytona --extra wandb
          --output-file tested/dependencies-lock.txt

      # The build reads its version from the tag. Check that the tag's version is the
      # one in the files that PyPI gets.
      - name: Built version must match the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          uv run --no-project --with packaging python - "$TAG" <<'PY'
          import pathlib, sys
          from packaging.version import Version
          tag = sys.argv[1]
          for wheel in pathlib.Path("dist").glob("*.whl"):
              built = wheel.name.split("-")[1]
              if Version(built) != Version(tag[1:]):
                  sys.exit(f"::error::{wheel.name} built version {built}, not the tag {tag}")
          PY

      - uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: tested
          path: tested/
          if-no-files-found: error

  pypi:
    # Before the tag is pushed: a failed upload leaves no tag to clean up. A rerun
    # after a later job fails skips the files PyPI already has.
    # The pypi environment needs a reviewer's approval.
    needs: [build, dependency-ranges]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/baseten-loops-cookbook
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      # Pinned by commit, as the publish action is: this job can get a PyPI token.
      - uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # Only a rerun uploads the same dist artifact again. On a first attempt, a
          # version that PyPI already has came from another build, so the upload fails.
          skip-existing: ${{ github.run_attempt != '1' }}

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          fetch-depth: 0
      - uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          name: tested
          path: tested/
      - uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          pattern: dependencies-*
          merge-multiple: true
          path: tested
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PREVIOUS: ${{ needs.build.outputs.previous }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # A rerun after the push and before the release finds the tag already
            # fetched: reuse it if it names this commit, so the release can still be made.
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              if [[ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
                echo "::error::$TAG already exists at another commit"
                exit 1
              fi
            else
              git tag "$TAG"
              git push origin "$TAG"
            fi
          fi
          FLAGS=(--generate-notes --title "$TAG")
          if [[ -n "$PREVIOUS" ]]; then FLAGS+=(--notes-start-tag "$PREVIOUS"); fi
          if [[ "$PRERELEASE" == "true" ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" dist/* tested/* "${FLAGS[@]}"
