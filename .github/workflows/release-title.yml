name: release-title
# A PR into main is a release: it comes from develop or a hotfix/ branch, and its
# title names the version that merging it will tag (see release.yml).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

jobs:
  release-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the branch and the version
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" != "develop" && "$HEAD_REF" != hotfix/* ]]; then
            echo "::error::a PR into main comes from develop or a hotfix/ branch, not $HEAD_REF"
            exit 1
          fi
          python3 scripts/release_version.py title "$TITLE"
