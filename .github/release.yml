# Groups GitHub's generated release notes by label. The pr-labels workflow sets the
# labels from each PR's title. A PR goes under the first category whose label it has.
# PRs that bots open as github-actions are left out.
changelog:
  exclude:
    authors: [github-actions, "github-actions[bot]"]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Docs
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
