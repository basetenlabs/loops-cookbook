<text x="235.96" y="217.2" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Run</text>
<text x="109.6" y="243.6" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">rl/recipe.py assembles it: trainer ·</text>
<text x="86.2" y="261.15" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">rollout runtime factory · renderer factory</text>
<text x="125.2" y="278.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">rl/run.py: preflight · gateway ·</text>
<text x="152.5" y="296.25" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">registry · shutdown order</text>
<rect x="1180" y="190" width="380" height="120" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="1337.24" y="234.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Trainer</text>
