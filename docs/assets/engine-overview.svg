<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 1980 1130" width="1980" height="1130">
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="-20" width="1980" height="1130" fill="#fff"/>
<text x="40" y="54.0" font-family="Helvetica, Arial" font-size="34" font-weight="bold" fill="#1e1e1e">The training engine</text>
<text x="40" y="84.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#6b7280">Who owns what inside one run. Arrows are calls; the rollout runtime contract is the only boundary user code sits behind.</text>
<rect x="40" y="100" width="1900" height="46" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1"/>
<text x="58" y="130.0" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Rollout runtimes run episodes; the engine owns scheduling, clocks, evidence, training and every billed resource.</text>
<rect x="1440" y="30" width="24" height="18" rx="0" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="1472" y="45.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#6b7280">cookbook</text>
