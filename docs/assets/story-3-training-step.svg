<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 2100 880" width="2100" height="880">
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="-20" width="2100" height="880" fill="#fff"/>
<text x="40" y="54.0" font-family="Helvetica, Arial" font-size="34" font-weight="bold" fill="#1e1e1e">One training step</text>
<text x="40" y="84.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#6b7280">Run loop in rl/run.py; trainer in rl/trainer.py. CISPO is the default; the loss is configurable.</text>
<rect x="40" y="100" width="1860" height="46" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1"/>
<text x="58" y="130.0" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Every step changes the weights and publishes them to the sampler. Staleness is bounded by max_steps_off_policy.</text>
<rect x="1400" y="30" width="24" height="18" rx="0" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="1432" y="45.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#6b7280">cookbook</text>
<rect x="1570" y="30" width="24" height="18" rx="0" fill="#b2f2bb" fill-opacity="1.0" stroke="#2f9e44" stroke-width="2"/>
<text x="1602" y="45.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#6b7280">user code</text>
<rect x="1740" y="30" width="24" height="18" rx="0" fill="#ffd8a8" fill-opacity="1.0" stroke="#e8590c" stroke-width="2"/>
<text x="1772" y="45.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#6b7280">external</text>
<rect x="40" y="190" width="400" height="140" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="183.84" y="235.975" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Pick a batch</text>
<text x="126.9" y="262.375" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">groups_per_step usable groups</text>
<text x="138.60000000000002" y="279.925" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">next_batch(): stale → size</text>
<text x="158.10000000000002" y="297.475" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">→ variance re-checked</text>
<rect x="500" y="190" width="400" height="140" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="653.2" y="244.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Advantages</text>
<text x="625.9" y="271.15" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">reward − group mean</text>
<text x="641.5" y="288.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">grpo.advantages</text>
<polyline points="440,260 500,260" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="960" y="190" width="400" height="140" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="1075.76" y="244.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Datums → aggregate</text>
<text x="1031.3" y="275.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">grpo.build_rows → aggregate_loss</text>
<text x="1082.0" y="288.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">whole grouped update</text>
<polyline points="900,260 960,260" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="1420" y="190" width="400" height="140" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="1545.12" y="244.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">forward_backward</text>
<text x="1553.7" y="271.15" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">training.loss_fn</text>
<text x="1569.3" y="288.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">default: CISPO</text>
<polyline points="1360,260 1420,260" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="40" y="400" width="400" height="140" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="193.2" y="463.525" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">optim_step</text>
<text x="169.8" y="489.92499999999995" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">the weights change</text>
<rect x="500" y="400" width="400" height="140" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="615.76" y="445.975" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Publish to sampler</text>
<text x="602.5" y="472.375" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">= weight sync, every step</text>
<text x="618.1" y="489.925" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">save_weights_and_get_</text>
<text x="641.5" y="507.475" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">sampling_client</text>
<polyline points="440,470 500,470" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="960" y="400" width="400" height="140" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="1113.2" y="454.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Checkpoint</text>
<text x="1074.2" y="481.15" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">every N steps, and the</text>
<text x="1062.5" y="498.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">final step (if max_steps)</text>
<polyline points="900,470 960,470" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="1420" y="400" width="400" height="140" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="1591.92" y="454.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Record</text>
<text x="1534.2" y="481.15" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">manifest · steps.jsonl</text>
<text x="1565.4" y="498.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">rollouts.jsonl</text>
<polyline points="1360,470 1420,470" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1620.0,330 1620.0,360 240,360 240,400" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="1880" y="190" width="180" height="350" rx="12" fill="#ffd8a8" fill-opacity="1.0" stroke="#e8590c" stroke-width="2"/>
<text x="1946.6" y="300.025" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Loops</text>
<text x="1927.88" y="323.42499999999995" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">trainer +</text>
<text x="1937.24" y="346.82499999999993" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">sampler</text>
<text x="1931.0" y="373.2249999999999" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">runs here:</text>
<text x="1907.6" y="390.7749999999999" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">forward_backward</text>
<text x="1931.0" y="408.32499999999993" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">optim_step</text>
<text x="1942.7" y="425.87499999999994" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">publish</text>
<text x="1931.0" y="443.42499999999995" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">checkpoint</text>
<polyline points="1820,250 1880,250" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#h)"/>
<rect x="40" y="590" width="900" height="230" rx="12" fill="#e3fafc" fill-opacity="0.7" stroke="#6b7280" stroke-width="1"/>
<text x="54" y="617.0" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#6b7280">Sync vs async  ([training] mode)</text>
<text x="64" y="654.0" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">sync</text>
<text x="64" y="678.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#1e1e1e">collect a batch → train → collect the next.</text>
<text x="64" y="698.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#1e1e1e">No new groups start while a step trains.</text>
<text x="64" y="740.0" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">async</text>
<text x="64" y="764.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#1e1e1e">sampling keeps going during the step. In-flight rollouts pick up</text>
<text x="64" y="784.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#1e1e1e">the new weights mid-episode. max_steps_off_policy caps how old</text>
<text x="64" y="804.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#1e1e1e">a sample may be.</text>
<rect x="980" y="590" width="1080" height="230" rx="12" fill="#fff0f6" fill-opacity="0.7" stroke="#6b7280" stroke-width="1"/>
<text x="994" y="617.0" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#6b7280">If anything raises during the step</text>
<text x="1004" y="652.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#1e1e1e">the batch is dropped as training_aborted, and a last-gasp checkpoint saves</text>
<text x="1004" y="672.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#1e1e1e">the last committed step, then the run stops.</text>
</svg>