<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 1980 1072" width="1980" height="1072">
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="-20" width="1980" height="1072" fill="#1e1e2e"/>
<text x="40" y="54.0" font-family="Helvetica, Arial" font-size="34" font-weight="bold" fill="#e5e5e5">Two interfaces, one contract</text>
<text x="40" y="84.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#a0a0a0">Both runtimes implement runtime/api.py&#x27;s six hooks, and may add the optional group grader; the engine sees no difference.</text>
<rect x="40" y="100" width="1900" height="46" rx="12" fill="#4d4417" fill-opacity="1.0" stroke="#fcc419" stroke-width="1"/>
<text x="58" y="130.0" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Episode: the user writes one class. Harbor: the user brings a Harbor job and a LoopsAgent. Both become the same RolloutRuntime.</text>
<rect x="40" y="180" width="700" height="70" rx="12" fill="#1a4d2e" fill-opacity="1.0" stroke="#69db7c" stroke-width="2"/>
<text x="239.2" y="212.0" font-family="Helvetica, Arial" font-size="20" font-weight="bold" fill="#e5e5e5">Episode runtime  ·  episodes/</text>
<text x="201.0" y="236.0" font-family="Menlo, monospace" font-size="14" font-weight="normal" fill="#a0a0a0">user writes: Episode[TaskModel, OptionsModel]</text>
<rect x="790" y="180" width="340" height="70" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="897.6" y="212.0" font-family="Helvetica, Arial" font-size="20" font-weight="bold" fill="#e5e5e5">the contract</text>
<text x="901.2" y="236.0" font-family="Menlo, monospace" font-size="14" font-weight="normal" fill="#a0a0a0">runtime/api.py</text>
<rect x="1180" y="180" width="760" height="70" rx="12" fill="#1a4d2e" fill-opacity="1.0" stroke="#69db7c" stroke-width="2"/>
<text x="1424.8" y="212.0" font-family="Helvetica, Arial" font-size="20" font-weight="bold" fill="#e5e5e5">Harbor runtime  ·  harbor/</text>
<text x="1392.0" y="236.0" font-family="Menlo, monospace" font-size="14" font-weight="normal" fill="#a0a0a0">user brings: a Harbor job + a LoopsAgent</text>
<rect x="790" y="280" width="340" height="84" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="911.4" y="328.0" font-family="Menlo, monospace" font-size="18" font-weight="bold" fill="#e5e5e5">prepare()</text>
<rect x="40" y="280" width="700" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="265.2" y="315.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">load tasks.jsonl; validate every</text>
<text x="296.4" y="334.5" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">line with the task model</text>
<rect x="1180" y="280" width="760" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="1427.4" y="315.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">load the job; one TaskRef per task</text>
<text x="1450.8" y="334.5" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">with Harbor&#x27;s content digest</text>
<polyline points="790,322 740,322" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1130,322 1180,322" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<rect x="790" y="384" width="340" height="84" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="916.8" y="432.0" font-family="Menlo, monospace" font-size="18" font-weight="bold" fill="#e5e5e5">sample()</text>
<rect x="40" y="384" width="700" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="234.0" y="419.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">admit → sandbox → Episode(task, options)</text>
<text x="253.5" y="438.5" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">→ setup(setup) → hold → run(sample)</text>
<rect x="1180" y="384" width="760" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="1415.7" y="419.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">submit a trial (Harbor retries off) →</text>
<text x="1411.8" y="438.5" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">env start → agent.run → park at verify</text>
<polyline points="790,426 740,426" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1130,426 1180,426" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<rect x="790" y="488" width="340" height="84" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="922.2" y="536.0" font-family="Menlo, monospace" font-size="18" font-weight="bold" fill="#e5e5e5">grade()</text>
<rect x="40" y="488" width="700" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="269.1" y="523.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">Episode.grade(grading) → reward</text>
<rect x="1180" y="488" width="760" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="1400.1" y="523.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">shared verifier: release the parked trial</text>
<text x="1419.6" y="542.5" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">separate: regrade from its artifacts</text>
<polyline points="790,530 740,530" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1130,530 1180,530" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<rect x="790" y="592" width="340" height="84" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="889.8" y="640.0" font-family="Menlo, monospace" font-size="18" font-weight="bold" fill="#e5e5e5">grade_group()</text>
<rect x="40" y="592" width="700" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="245.7" y="627.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">Episode.grade_group(members, options)</text>
<text x="312.0" y="646.5" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">optional classmethod</text>
<rect x="1180" y="592" width="760" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="1509.3" y="627.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">— not offered</text>
<polyline points="790,634 740,634" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1130,634 1180,634" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<rect x="790" y="696" width="340" height="84" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="862.8" y="744.0" font-family="Menlo, monospace" font-size="18" font-weight="bold" fill="#e5e5e5">finish() / abort()</text>
<rect x="40" y="696" width="700" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="253.49999999999997" y="731.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">close(closing) → attached clients →</text>
<text x="230.09999999999997" y="750.5" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">attempt dir; release registered resources</text>
<rect x="1180" y="696" width="760" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="1407.9" y="731.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">wait for the trial&#x27;s environment stops;</text>
<text x="1497.6" y="750.5" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">sandbox released</text>
<polyline points="790,738 740,738" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1130,738 1180,738" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<rect x="790" y="800" width="340" height="84" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="922.2" y="848.0" font-family="Menlo, monospace" font-size="18" font-weight="bold" fill="#e5e5e5">close()</text>
<rect x="40" y="800" width="700" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="386.1" y="835.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">—</text>
<rect x="1180" y="800" width="760" height="84" rx="12" fill="#1e1e2e" fill-opacity="1.0" stroke="#a0a0a0" stroke-width="1"/>
<text x="1427.4" y="835.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">cancel retained trials; fail if an</text>
<text x="1458.6" y="854.5" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#e5e5e5">environment would not stop</text>
<polyline points="790,842 740,842" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1130,842 1180,842" fill="none" stroke="#a0a0a0" stroke-width="2" marker-end="url(#h)"/>
<rect x="40" y="916" width="1900" height="96" rx="12" fill="#4d4417" fill-opacity="1.0" stroke="#fcc419" stroke-width="1"/>
<text x="60" y="946.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">Same for both: the driver owns the clocks, retries, seal and cleanup order around these hooks, and builds the Rollout from the lease.</text>
<text x="60" y="966.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">The runtime declares its model access and grading retries (Episode: class attributes; Harbor: the agent and the job&#x27;s retry: block).</text>
</svg>