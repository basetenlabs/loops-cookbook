<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 1920 1290" width="1920" height="1290">
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="-20" width="1920" height="1290" fill="#fff"/>
<text x="40" y="54.0" font-family="Helvetica, Arial" font-size="34" font-weight="bold" fill="#1e1e1e">Who owns a sandbox</text>
<text x="40" y="84.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#6b7280">Blaxel (custom rollout runtime or Harbor on Blaxel). resources/registry.py + journal.py + providers/blaxel/adapter.py</text>
<rect x="40" y="100" width="1840" height="46" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1"/>
<text x="58" y="130.0" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Every paid sandbox is written down before it exists, so a crash never loses track of one.</text>
<rect x="1380" y="30" width="24" height="18" rx="0" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="1412" y="45.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#6b7280">cookbook</text>
<rect x="1550" y="30" width="24" height="18" rx="0" fill="#b2f2bb" fill-opacity="1.0" stroke="#2f9e44" stroke-width="2"/>
<text x="1582" y="45.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#6b7280">user code</text>
<rect x="1720" y="30" width="24" height="18" rx="0" fill="#ffd8a8" fill-opacity="1.0" stroke="#e8590c" stroke-width="2"/>
<text x="1752" y="45.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#6b7280">external</text>
<rect x="40" y="170" width="1100" height="700" rx="12" fill="#dbe4ff" fill-opacity="0.7" stroke="#6b7280" stroke-width="1"/>
<text x="54" y="197.0" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#6b7280">Normal life</text>
<rect x="1180" y="170" width="700" height="700" rx="12" fill="#e3fafc" fill-opacity="0.7" stroke="#6b7280" stroke-width="1"/>
<text x="1194" y="197.0" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#6b7280">resources/v1/journal.jsonl (fsync&#x27;d, one per run)</text>
<rect x="80" y="220" width="460" height="90" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="189.36" y="257.825" font-family="Helvetica, Arial" font-size="16" font-weight="bold" fill="#1e1e1e">1  Attempt asks for a sandbox</text>
<text x="200.8" y="283.625" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">resources.provision(request)</text>
<rect x="80" y="330" width="460" height="90" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="206.0" y="359.05" font-family="Helvetica, Arial" font-size="16" font-weight="bold" fill="#1e1e1e">2  Write the intent first</text>
<text x="216.4" y="384.85" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">append(&#x27;intent&#x27;) + fsync</text>
<text x="224.2" y="402.40000000000003" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">before any Blaxel call</text>
<rect x="80" y="440" width="460" height="90" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="230.95999999999998" y="469.05" font-family="Helvetica, Arial" font-size="16" font-weight="bold" fill="#1e1e1e">3  Create at Blaxel</text>
<text x="204.7" y="494.85" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">labelled loops.run_id=&lt;run&gt;</text>
<text x="224.2" y="512.4000000000001" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">SandboxInstance.create</text>
<rect x="80" y="550" width="460" height="90" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="214.32" y="579.05" font-family="Helvetica, Arial" font-size="16" font-weight="bold" fill="#1e1e1e">4  Record what happened</text>
<text x="185.2" y="604.8499999999999" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">created · definitely not created</text>
<text x="216.4" y="622.3999999999999" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">· ambiguous → look it up</text>
<rect x="80" y="660" width="460" height="90" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="176.88" y="689.05" font-family="Helvetica, Arial" font-size="16" font-weight="bold" fill="#1e1e1e">5  Release when the attempt ends</text>
<text x="208.60000000000002" y="714.8499999999999" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">delete (404 is fine), then</text>
<text x="255.4" y="732.3999999999999" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">confirm absent</text>
<polyline points="310.0,310 310.0,330" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<polyline points="310.0,420 310.0,440" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<polyline points="310.0,530 310.0,550" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<polyline points="310.0,640 310.0,660" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="600" y="440" width="280" height="90" rx="12" fill="#ffd8a8" fill-opacity="1.0" stroke="#e8590c" stroke-width="2"/>
<text x="711.92" y="469.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#1e1e1e">Blaxel</text>
<text x="669.8" y="496.15" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">sandbox exists and</text>
<text x="701.0" y="513.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">is billing</text>
<polyline points="540,485 600,485" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#h)"/>
<rect x="1220" y="330" width="300" height="90" rx="12" fill="#ffffff" fill-opacity="1.0" stroke="#6b7280" stroke-width="2"/>
<text x="1346.6" y="380.25" font-family="Helvetica, Arial" font-size="15" font-weight="bold" fill="#1e1e1e">intent</text>
<polyline points="540,375 1220,375" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#h)"/>
<rect x="1220" y="550" width="300" height="90" rx="12" fill="#ffffff" fill-opacity="1.0" stroke="#6b7280" stroke-width="2"/>
<text x="1272.5" y="590.5" font-family="Helvetica, Arial" font-size="15" font-weight="bold" fill="#1e1e1e">created / create_failed /</text>
<text x="1268.6" y="610.0" font-family="Helvetica, Arial" font-size="15" font-weight="bold" fill="#1e1e1e">reconciled_found | _absent</text>
<polyline points="540,595 1220,595" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#h)"/>
<rect x="1220" y="660" width="300" height="90" rx="12" fill="#ffffff" fill-opacity="1.0" stroke="#6b7280" stroke-width="2"/>
<text x="1338.8" y="710.25" font-family="Helvetica, Arial" font-size="15" font-weight="bold" fill="#1e1e1e">released</text>
<polyline points="540,705 1220,705" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#h)"/>
<text x="1220" y="795.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#6b7280">Ambiguous create: look up by name + labels</text>
<text x="1220" y="813.75" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#6b7280">and record found or absent.</text>
<rect x="40" y="900" width="1840" height="330" rx="12" fill="#fff0f6" fill-opacity="0.7" stroke="#6b7280" stroke-width="1"/>
<text x="54" y="927.0" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#6b7280">If the process dies with sandboxes alive</text>
<rect x="80" y="960" width="420" height="130" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="228.12" y="1000.625" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#1e1e1e">Resume the run</text>
<text x="208.10000000000002" y="1026.725" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">same run id + run dir</text>
<text x="200.3" y="1044.275" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">→ same journal (locked)</text>
<text x="188.60000000000002" y="1061.825" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">→ release_all() at startup</text>
<rect x="560" y="960" width="420" height="130" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="650.66" y="1009.4" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#1e1e1e">loops cleanup --state-dir</text>
<text x="695.9" y="1035.5" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">replay the journal,</text>
<text x="695.9" y="1053.05" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">release what&#x27;s left</text>
<rect x="1040" y="960" width="420" height="130" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2"/>
<text x="1143.92" y="1009.4" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#1e1e1e">loops cleanup --run-id</text>
<text x="1156.4" y="1035.5" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">no journal: sweep Blaxel</text>
<text x="1175.9" y="1053.05" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#6b7280">by the run-id label</text>
<rect x="80" y="1110" width="1780" height="70" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1"/>
<text x="96" y="1137.0" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#1e1e1e">Worth knowing: a replayed intent can&#x27;t be proved absent for 600 s, so an early cleanup reports it unconfirmed. A label sweep always</text>
<text x="96" y="1155.75" font-family="Helvetica, Arial" font-size="15" font-weight="normal" fill="#1e1e1e">leaves one unconfirmed entry (the listing) and exits 3. Harbor environments other than Blaxel and Daytona are not tracked at all.</text>
</svg>