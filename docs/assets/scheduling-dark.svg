<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 2000 960" width="2000" height="960">
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="-20" width="2000" height="960" fill="#1e1e2e"/>
<text x="40" y="54.0" font-family="Helvetica, Arial" font-size="34" font-weight="bold" fill="#e5e5e5">Scheduling: from a task to a batch</text>
<text x="40" y="84.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#a0a0a0">rl/pipeline.py (groups, workers, gating, batches) + runtime/capacity.py (admission and slots). Waiting anywhere holds nothing.</text>
<rect x="40" y="100" width="1920" height="46" rx="12" fill="#4d4417" fill-opacity="1.0" stroke="#fcc419" stroke-width="1"/>
<text x="58" y="130.0" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Three limits bound the work; one gate (sync demand or the async window) decides when new groups start.</text>
<rect x="40" y="200" width="340" height="150" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="158.51999999999998" y="259.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Task stream</text>
<text x="120.3" y="286.15" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">shuffled once per epoch</text>
<text x="155.4" y="303.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">(shuffle_seed)</text>
<rect x="435" y="200" width="340" height="150" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="548.84" y="250.975" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Make a group</text>
<text x="503.6" y="277.375" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">group_size rollouts of one</text>
<text x="507.5" y="294.925" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">task · only when the gate</text>
<text x="550.4" y="312.475" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">allows (below)</text>
<rect x="830" y="200" width="340" height="150" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="929.8" y="250.975" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Admission queue</text>
<text x="867.4" y="277.375" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">oldest group first · admitted when</text>
<text x="941.5" y="294.925" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">active &lt; target</text>
<text x="922.0" y="312.475" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">(+ pre-start places)</text>
<rect x="1225" y="200" width="340" height="150" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="1371.6" y="259.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Setup</text>
<text x="1289.7" y="286.15" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">sandbox create · __init__ ·</text>
<text x="1293.6" y="303.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">setup(setup) · setup clock</text>
<rect x="1245" y="344" width="300" height="34" rx="12" fill="#4d4417" fill-opacity="1.0" stroke="#fcc419" stroke-width="1"/>
<text x="1266.3" y="365.0" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#e5e5e5">≤ max_concurrent_provisioning (8)</text>
<rect x="1620" y="200" width="340" height="150" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="1729.16" y="259.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Sampling slot</text>
<text x="1684.6999999999998" y="286.15" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">run(sample) · rollout clock</text>
<text x="1719.8" y="303.7" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">and agent deadline</text>
<rect x="1640" y="344" width="300" height="34" rx="12" fill="#4d4417" fill-opacity="1.0" stroke="#fcc419" stroke-width="1"/>
<text x="1673.0" y="365.0" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#e5e5e5">≤ max_concurrent_rollouts (64)</text>
<rect x="40" y="470" width="340" height="150" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="144.48000000000002" y="538.525" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Train one step</text>
<text x="120.3" y="564.925" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">see “One training step”</text>
<rect x="435" y="470" width="340" height="150" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="548.84" y="520.975" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Pick a batch</text>
<text x="491.9" y="547.375" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">groups_per_step usable groups</text>
<text x="515.3" y="564.925" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">stale → size → variance</text>
<text x="468.5" y="582.4749999999999" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">held-over first, then oldest policy</text>
<rect x="830" y="470" width="340" height="150" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="934.48" y="520.975" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Group complete</text>
<text x="902.5" y="547.375" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">all group_size resolved ·</text>
<text x="914.2" y="564.925" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">optional grade_group()</text>
<text x="937.6" y="582.4749999999999" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">replaces rewards</text>
<rect x="850" y="614" width="300" height="34" rx="12" fill="#4d4417" fill-opacity="1.0" stroke="#fcc419" stroke-width="1"/>
<text x="883.0" y="635.0" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#e5e5e5">judge: the same verifier slots</text>
<rect x="1225" y="470" width="340" height="150" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="1338.84" y="538.525" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Grading slot</text>
<text x="1278.0" y="564.925" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">grade(grading) · grading clock</text>
<rect x="1245" y="614" width="300" height="34" rx="12" fill="#4d4417" fill-opacity="1.0" stroke="#fcc419" stroke-width="1"/>
<text x="1274.1" y="635.0" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#e5e5e5">≤ max_concurrent_verifiers (16)</text>
<rect x="1620" y="470" width="340" height="150" rx="12" fill="#1e3a5f" fill-opacity="1.0" stroke="#4dabf7" stroke-width="2"/>
<text x="1719.8" y="529.75" font-family="Helvetica, Arial" font-size="18" font-weight="bold" fill="#e5e5e5">Sealed, waiting</text>
<text x="1680.8" y="556.15" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">holds no slot while it waits</text>
<text x="1743.2" y="573.6999999999999" font-family="Menlo, monospace" font-size="13" font-weight="normal" fill="#a0a0a0">to be graded</text>
<polyline points="380,275 435,275" fill="none" stroke="#e5e5e5" stroke-width="2" marker-end="url(#h)"/>
<polyline points="775,275 830,275" fill="none" stroke="#e5e5e5" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1170,275 1225,275" fill="none" stroke="#e5e5e5" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1565,275 1620,275" fill="none" stroke="#e5e5e5" stroke-width="2" marker-end="url(#h)"/>
<polyline points="435,545 380,545" fill="none" stroke="#e5e5e5" stroke-width="2" marker-end="url(#h)"/>
<polyline points="830,545 775,545" fill="none" stroke="#e5e5e5" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1225,545 1170,545" fill="none" stroke="#e5e5e5" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1620,545 1565,545" fill="none" stroke="#e5e5e5" stroke-width="2" marker-end="url(#h)"/>
<polyline points="1790.0,384 1790.0,470" fill="none" stroke="#e5e5e5" stroke-width="2" marker-end="url(#h)"/>
<rect x="1806.44" y="418.0" width="37.120000000000005" height="21.5" rx="0" fill="#1e1e2e" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="1810.44" y="434.0" font-family="Helvetica, Arial" font-size="14" font-weight="normal" fill="#e5e5e5">seal</text>
<rect x="40" y="700" width="620" height="200" rx="12" fill="#1d3336" fill-opacity="0.7" stroke="#a0a0a0" stroke-width="1"/>
<text x="54" y="727.0" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#a0a0a0">sync  ([training] mode)</text>
<text x="64" y="762.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">Start groups only while fewer than</text>
<text x="64" y="782.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">groups_per_step are live. Collect them,</text>
<text x="64" y="802.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">train, publish, then start the next set.</text>
<text x="64" y="822.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">Every sample in a batch comes from the</text>
<text x="64" y="842.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">policy that batch trains.</text>
<rect x="690" y="700" width="620" height="200" rx="12" fill="#242c45" fill-opacity="0.7" stroke="#a0a0a0" stroke-width="1"/>
<text x="704" y="727.0" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#a0a0a0">async</text>
<text x="714" y="762.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">Keep sampling while the trainer works.</text>
<text x="714" y="782.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">A group starts while started groups &lt; window,</text>
<text x="714" y="802.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">window = (msop, +1 when idle) × groups_per_step</text>
<text x="714" y="822.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">  + the groups expected to drop.</text>
<text x="714" y="842.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">A closed window never stops a running rollout.</text>
<rect x="1340" y="700" width="620" height="200" rx="12" fill="#3a3024" fill-opacity="0.7" stroke="#a0a0a0" stroke-width="1"/>
<text x="1354" y="727.0" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#a0a0a0">pre-start places</text>
<text x="1364" y="762.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">ceil(prestart_allowance × 64) = 7 extra</text>
<text x="1364" y="782.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">admissions, so a sandbox is ready when a</text>
<text x="1364" y="802.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">sampling slot frees. Only on top of the full</text>
<text x="1364" y="822.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">target: under backpressure no new group</text>
<text x="1364" y="842.0" font-family="Helvetica, Arial" font-size="16" font-weight="normal" fill="#e5e5e5">starts early. A started group&#x27;s siblings always fill.</text>
</svg>