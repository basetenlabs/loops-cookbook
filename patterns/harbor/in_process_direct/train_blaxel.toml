# Harbor, in-process, direct, on Blaxel sandboxes.
# uv sync --extra harbor-blaxel
# uv run loops check patterns/harbor/in_process_direct/train_blaxel.toml

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.harbor:create_runtime"

[rollout_runtime.files]
job = "job_blaxel.yaml"

[providers.blaxel]
# Credentials stay in .env as BL_WORKSPACE and BL_API_KEY. Every sandbox is created in
# this region, because the job doesn't name one. Every deadline has a default.
# Harbor's start bound adds reconcile, image build, create and attach, which is
# 60 + 420 + 120 + 30 = 630 s. That fits within the task's build timeout, 600 s times
# the job's environment_build_timeout_multiplier of 1.1.
region = "us-was-1"
# A deadline set here replaces its default.
# attach_timeout_seconds = 45

[model]
base_model = "Qwen/Qwen3.6-35B-A3B"
lora_rank = 8
max_seq_len = 1024
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
temperature = 1.2
max_generation_tokens = 128

[training]
mode = "sync"
group_size = 16
# A cloud sandbox can fail, so a group that loses one rollout still trains.
max_group_losses = 1
groups_per_step = 1
max_steps = 5
max_consecutive_unusable_groups = 20
learning_rate = 0.00002
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 4
max_concurrent_verifiers = 4
# A rollout whose sandbox or trial fails is retried up to this many times.
max_rollout_retries = 2
rollout_timeout_seconds = 600
setup_timeout_seconds = 600

[rollout.grading]
# The grading deadline must exceed Harbor's own bound, which is a 660 s build plus
# a 30 s verifier.
timeout_seconds = 900

[compute]
scope = "serverless"

[output]
trainer_checkpoint_every = 0
sampler_checkpoint_every = 0
run_name = "harbor-direct-blaxel"
output_dir = "runs/harbor-direct-blaxel"
checkpoint_ttl_seconds = 0
