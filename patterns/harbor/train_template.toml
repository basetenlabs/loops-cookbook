# A training config template for the Harbor rollout runtime. Copy it next to your
# Harbor job and agent, edit it, and then run `uv run loops check train.toml`.
# Paths in [rollout_runtime.files] and resume_from are relative to this file. output_dir
# is relative to the directory you run from. `loops run --help` documents every setting.

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.harbor:create_runtime"

[rollout_runtime.files]
# Your Harbor JobConfig, in JSON or YAML.
job = "job.yaml"

[rollout_runtime.config]
# Set this only if your verifier emits several rewards.
# reward_key = "reward"

[model]
base_model = "Qwen/Qwen3.6-35B-A3B"
# Each sequence may hold at most this many tokens.
max_seq_len = 32768
lora_rank = 32
# These options depend on the model. See its chat template.
# renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
max_generation_tokens = 4096

[training]
# "async" samples the next step's rollouts while the current step trains.
mode = "sync"
# Each step is one optimizer update.
max_steps = 5
learning_rate = 0.00001
group_size = 8
# A group may lose this many rollouts and still train.
max_group_losses = 2
groups_per_step = 8
# Stop after this many groups in a row that can't train, such as groups in which
# every rollout scores alike.
max_consecutive_unusable_groups = 20
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 64
max_concurrent_verifiers = 16
# A rollout may hold sampling capacity for this long.
rollout_timeout_seconds = 3600
# Setup may take this long. It holds no sampling capacity while it runs.
setup_timeout_seconds = 1800

[rollout.grading]
# This must exceed Harbor's own bound, which loops check computes.
timeout_seconds = 3600

[compute]
scope = "serverless"

[output]
run_name = "my-run"
output_dir = "runs"
# Save a checkpoint every this many updates. 0 turns checkpoints off.
trainer_checkpoint_every = 5
sampler_checkpoint_every = 5
checkpoint_ttl_seconds = 0
# This needs the wandb extra.
# wandb_project = "my-project"
