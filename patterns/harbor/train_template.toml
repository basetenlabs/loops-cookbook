# Training config template for the Harbor runtime. Copy next to your Harbor job and
# agent, edit, then: uv run loops check train.toml
# [rollout_runtime.files] and resume_from are relative to this file; output_dir is relative to
# where you run. `loops run --help` documents every setting.

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.harbor:create_runtime"

[rollout_runtime.files]
job = "job.yaml"        # your Harbor JobConfig (JSON or YAML)

[rollout_runtime.config]
# reward_key = "reward"           # only if your verifier emits several rewards

[model]
base_model = "Qwen/Qwen3.6-35B-A3B"
max_seq_len = 32768               # per-sequence token budget for the trainer
lora_rank = 32
# renderer_chat_template_kwargs = { enable_thinking = false }   # model-specific; see the model's chat template

[sampling]
max_generation_tokens = 4096

[training]
mode = "sync"                     # "async" overlaps collection and training
max_steps = 5                     # optimizer updates
learning_rate = 0.00001
group_size = 8                    # rollouts per task
max_group_losses = 2              # rollouts a group may lose and still train
groups_per_step = 8               # groups per update
max_consecutive_unusable_groups = 20   # abort after this many untrainable groups in a row (uniform rewards, or too few rollouts)
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 64               # concurrent agents
max_concurrent_verifiers = 16                # concurrent verifiers
rollout_timeout_seconds = 3600           # time holding sampling capacity
setup_timeout_seconds = 1800             # pre-seal time outside capacity holds

[rollout.grading]
timeout_seconds = 3600  # must exceed Harbor's bound; loops check computes it

[compute]
scope = "serverless"

[output]
run_name = "my-run"
output_dir = "runs"
trainer_checkpoint_every = 5                    # checkpoint every N updates; 0 disables
sampler_checkpoint_every = 5
checkpoint_ttl_seconds = 0
# wandb_project = "my-project"    # needs the wandb extra
