# A custom rollout runtime, local. For each episode, local_episode.py runs
# agent_program.py as its own process on the training machine, in a sandbox the run
# provisions. The program calls the model over the run's gateway, and verifier.py
# scores the result.
# uv run loops check patterns/custom_runtime/local/train.toml
#
# local_sandbox.py makes each sandbox a directory, so this config runs anywhere. A real
# provider such as [providers.blaxel] plugs in through [rollout_runtime.config.sandbox].
# agent_program.py and verifier.py reach the sandbox only through its usage environment,
# so they work with either.

recipe = "rl"

[rollout_runtime]
factory = "loops_cookbook.episodes:create_runtime"

[rollout_runtime.files]
# Each task hides one answer for the model to learn. tasks/README.md describes the file.
tasks = "../../../tasks/hidden_answer.jsonl"

[rollout_runtime.config]
episode = "local_episode:DirectoryAgentEpisode"
# The agent's deadline. A rollout cut off before the model replies is discarded.
# One cut off after the reply is graded on what the agent left.
agent_timeout_seconds = 90

# The two programs run with the PATH's python3, which `uv run` makes the training
# interpreter, with the Blaxel SDK that sandbox_io needs for a Blaxel sandbox.
# A ./ or ../ path in either command resolves beside local_episode.py.
[rollout_runtime.config.options]
agent = ["python3", "./agent_program.py"]
verifier = ["python3", "./verifier.py"]
# Set "sandbox" to verify the answer the agent left in its sandbox instead.
grade_against = "files"

[rollout_runtime.config.sandbox]
provider = "local_sandbox"

[providers.local_sandbox]
adapter = "local_sandbox:create"
root = "/tmp/loops-local-sandboxes"
create_timeout_seconds = 30
reconcile_timeout_seconds = 30
release_timeout_seconds = 30
confirm_absent_timeout_seconds = 30
list_timeout_seconds = 30
attach_timeout_seconds = 30

[model]
base_model = "Qwen/Qwen3.5-4B"
lora_rank = 8
max_seq_len = 1024
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
max_generation_tokens = 32

[training]
mode = "sync"
group_size = 16
max_group_losses = 0
groups_per_step = 1
max_steps = 5
# Stop after this many groups in a row that can't train, such as groups in which
# every rollout scores alike.
max_consecutive_unusable_groups = 20
learning_rate = 0.0001
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 16
max_concurrent_verifiers = 16
setup_timeout_seconds = 60

[rollout.grading]
timeout_seconds = 30

[compute]
scope = "dedicated"

[output]
run_name = "custom-local-dir"
output_dir = "runs/custom-local-dir"
trainer_checkpoint_every = 0
sampler_checkpoint_every = 0
checkpoint_ttl_seconds = 0
