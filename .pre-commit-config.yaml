# Install once per clone:
#   uvx pre-commit install
# Run on every file:
#   uvx pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# Diagrams that excalidraw writes; the hooks would rewrite every export.
exclude: ^docs/assets/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  # The commit subject is a Conventional Commit, as the PR title is (pr-title.yml).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, refactor, perf, build, ci, deps, chore, revert]

  # Ruff from uv.lock, so the hook and CI use the same version.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        exclude: ^src/loops_cookbook/model_access/openai/schema/models\.py$
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^src/loops_cookbook/model_access/openai/schema/models\.py$
