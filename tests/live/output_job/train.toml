# One training step of the live output check (tests/live/test_output_end_to_end.py).

recipe = "rl"

[runtime]
factory = "loops_cookbook.harbor:create_runtime"

[runtime.files]
job = "job.yaml"

[providers.blaxel]
# Credentials stay in .env as BL_WORKSPACE and BL_API_KEY. Every sandbox is created in
# this region; the job does not name one. Every deadline has a default: Harbor's start
# bound, reconcile + image build + create + attach (60 + 420 + 120 + 30 = 630s), fits
# the task's build timeout (600s, times the job's environment_build_timeout_multiplier
# of 1.1).
region = "us-was-1"

[model]
base_model = "Qwen/Qwen3.5-4B"
lora_rank = 8
max_seq_len = 1024
renderer_chat_template_kwargs = { enable_thinking = false }

[sampling]
temperature = 1.2
max_generation_tokens = 16

[training]
mode = "sync"
group_size = 4
max_group_losses = 1   # a cloud sandbox can fail; its group still trains
groups_per_step = 1
max_steps = 1
max_consecutive_unusable_groups = 3
learning_rate = 0.0001
loss_fn = "cispo"

[rollout]
max_concurrent_rollouts = 4
max_concurrent_verifiers = 4
max_rollout_retries = 2   # a failed sandbox or trial gets a fresh attempt
rollout_timeout_seconds = 600
setup_timeout_seconds = 600

[rollout.grading]
timeout_seconds = 900  # > Harbor's own bound: build 660s + verifier 30s

[compute]
scope = "dedicated"
# reuse_from_run_id = "<prior-run-id>"   # reuses warm pods, not training state

[output]
trainer_checkpoint_every = 0
sampler_checkpoint_every = 0
run_name = "live-output"
output_dir = "runs/live-output"
checkpoint_ttl_seconds = 0
